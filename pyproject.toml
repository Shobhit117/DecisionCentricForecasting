[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilistic-modeling"
version = "0.3.0"
description = "Probabilistic demand forecasting, discrete distribution algebra, and inventory optimization & simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "matplotlib",
    "numba",
    "catboost",
]

[project.optional-dependencies]
# Extra dependencies for the M5 example scripts (download + Polars preprocessing + Parquet I/O)
m5 = ["polars", "pyarrow", "requests"]
# Optional: makes NumPy FFT available inside Numba kernels (otherwise a pure-Numba radix-2 FFT is used)
fft = ["rocket-fft"]
dev = ["pytest", "polars", "pyarrow", "requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
